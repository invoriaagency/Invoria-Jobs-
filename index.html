<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Invoria Jobs</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    h1 {
      background: #007bff;
      color: white;
      padding: 15px;
    }

    .job {
      background: white;
      margin: 20px auto;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Invoria Jobs</h1>
<h2>Lowongan Terbaru</h2>

<div id="jobs"></div>

<!-- ✅ SUPABASE (FIXED VERSION) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 🔥 PENTING: pakai nama beda biar tidak bentrok
  const supabaseClient = window.supabase.createClient(
    "https://twhmsejnxieawhtoezli.supabase.co",
    "sb_publishable_vFOu1L_6oFGgCJg_Ra49ZQ_M2CUkssK"
  );

  async function loadJobs() {
    const { data, error } = await supabaseClient
      .from('jobs')
      .select('*');

    if (error) {
      console.log("ERROR:", error);
      return;
    }

    const container = document.getElementById("jobs");
    container.innerHTML = "";

    data.forEach(job => {
      const div = document.createElement("div");
      div.className = "job";
      div.innerHTML = `
        <h3>${job.title}</h3>
        <p>${job.company}</p>
        <button>Lamar</button>
      `;
      container.appendChild(div);
    });
  }

  loadJobs();
</script>

</body>
</html>
