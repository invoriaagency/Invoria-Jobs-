<!DOCTYPE html>
<html>
<head>
  <title>Invoria Jobs</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f7fa;
    }
    header {
      background: #0a66c2;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      padding: 40px;
      text-align: center;
    }
    .job {
      background: white;
      padding: 20px;

      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      background: #0a66c2;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>🚀 Invoria Jobs</header>

<div class="container">
  <h2>Lowongan Terbaru</h2>

  <div class="job">
    <h3>Frontend Developer</h3>
    <p>PT Tech Indonesia</p>
    <button>Lamar</button>
  </div>

  <div class="job">
    <h3>UI/UX Designer</h3>
    <p>Startup Digital</p>
    <button>Lamar</button>
  </div>

</div>

</body>
</html>
